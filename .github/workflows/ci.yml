name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio black isort mypy

      - name: Check code formatting
        run: |
          black --check backend/ tests/ || echo "Code formatting issues found"
          isort --check-only backend/ tests/ || echo "Import sorting issues found"

      - name: Run type checking
        run: |
          mypy backend/ --ignore-missing-imports || echo "Type checking issues found"

      - name: Run tests
        run: |
          export PYTHONPATH=$(pwd)
          pytest tests/ -v --cov=backend --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run frontend linting
        working-directory: frontend
        run: npm run lint || echo "Frontend linting issues found"

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          bandit -r backend/ -ll || echo "Security issues found"

      - name: Check dependencies for vulnerabilities
        run: |
          safety check -r requirements.txt || echo "Vulnerable dependencies found"

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t vulnsphere-prime:test .

      - name: Test Docker image
        run: |
          docker run --rm vulnsphere-prime:test python -c "from backend.core.zkaedi_prime_boosted import ZKAEDIPrimeBoosted; print('Import successful')"
