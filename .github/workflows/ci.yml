name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio black isort mypy

      - name: Check code formatting
        run: |
          black --check backend/ tests/ || echo "Code formatting issues found"
          isort --check-only backend/ tests/ || echo "Import sorting issues found"

      - name: Run type checking
        run: |
          mypy backend/ --ignore-missing-imports || echo "Type checking issues found"

      - name: Run tests
        run: |
          export PYTHONPATH=$(pwd)
          pytest tests/ -v --cov=backend --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run frontend linting
        working-directory: frontend
        run: npm run lint || echo "Frontend linting issues found"

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies for eBPF (non-critical)
      run: |
        sudo apt-get update
        sudo apt-get install -y bpfcc-tools python3-bpfcc || echo "non-critical, continuing"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bcc==0.1.10 --no-cache-dir || echo "Skipping bcc"
        pip install -r requirements.txt || pip install --no-deps -r requirements.txt

    - name: Run Tests
      run: |
        pytest tests/ -v --cov=backend --cov-report=xml

    - name: Upload Coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
