jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check Out Code
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bpfcc-tools python3-bpfcc || echo "non-critical, continuing"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bcc==0.1.10 --no-cache-dir || echo "Skipping bcc"
        pip install -r requirements.txt || pip install --no-deps -r requirements.txt

    - name: Run Pytest
      run: |
        pytest tests/ -v --cov=backend --cov-report=xml --ignore=tests/test_mpi_hello_cart.py

    - name: Upload Coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml

    - name: Run MPI tests manually
      run: |
        mpiexec -n 4 python tests/test_mpi_hello_cart.py
