name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies for eBPF (non-critical)
      run: |
        sudo apt-get update
        sudo apt-get install -y bpfcc-tools python3-bpfcc || echo "non-critical, continuing"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bcc==0.1.10 --no-cache-dir || echo "Skipping bcc"
        pip install -r requirements.txt || pip install --no-deps -r requirements.txt

    - name: Run Tests
      run: |
        pytest tests/ -v --cov=backend --cov-report=xml

    - name: Upload Coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
