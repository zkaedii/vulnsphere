name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies for eBPF
      run: |
        sudo apt-get update
        sudo apt-get install -y bpfcc-tools python3-bpfcc || echo "eBPF tools installation skipped (not critical for CI)"
    
    - name: Install system dependencies for eBPF (optional)
      run: |
        sudo apt-get update
        sudo apt-get install -y bpfcc-tools python3-bpfcc || echo "eBPF tools installation skipped (not critical for CI)"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install bcc separately with fallback if it fails
        pip install bcc==0.1.10 || echo "bcc installation failed, continuing without eBPF support"
        # Install remaining dependencies
        pip install -r requirements.txt || pip install -r requirements.txt --ignore-installed bcc
        pip install pytest pytest-cov pytest-asyncio
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=backend --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
