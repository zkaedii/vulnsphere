apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vulnsphere-ingress
  namespace: vulnsphere
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  tls:
    - hosts:
        - vulnsphere.example.com
        - api.vulnsphere.example.com
      secretName: vulnsphere-tls
  rules:
    - host: vulnsphere.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vulnsphere-frontend
                port:
                  number: 80
    - host: api.vulnsphere.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vulnsphere-backend
                port:
                  number: 8000
