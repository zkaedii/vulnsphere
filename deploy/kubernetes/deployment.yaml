apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnsphere-backend
  namespace: vulnsphere
  labels:
    app: vulnsphere-prime
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vulnsphere-prime
      component: backend
  template:
    metadata:
      labels:
        app: vulnsphere-prime
        component: backend
    spec:
      containers:
        - name: backend
          image: vulnsphere/backend:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vulnsphere-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: vulnsphere-secrets
                  key: redis-url
            - name: DEBUG
              value: "false"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vulnsphere-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnsphere-frontend
  namespace: vulnsphere
  labels:
    app: vulnsphere-prime
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vulnsphere-prime
      component: frontend
  template:
    metadata:
      labels:
        app: vulnsphere-prime
        component: frontend
    spec:
      containers:
        - name: frontend
          image: vulnsphere/frontend:latest
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
