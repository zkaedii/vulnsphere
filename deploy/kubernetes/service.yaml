apiVersion: v1
kind: Service
metadata:
  name: vulnsphere-backend
  namespace: vulnsphere
  labels:
    app: vulnsphere-prime
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: vulnsphere-prime
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: vulnsphere-frontend
  namespace: vulnsphere
  labels:
    app: vulnsphere-prime
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: vulnsphere-prime
    component: frontend
