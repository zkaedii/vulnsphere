apiVersion: v1
kind: ConfigMap
metadata:
  name: vulnsphere-config
  namespace: vulnsphere
  labels:
    app: vulnsphere-prime
data:
  # ZKAEDI PRIME Engine Configuration
  FRACTAL_ALPHA: "0.618"
  ETA: "0.4"
  GAMMA: "0.3"
  BETA: "0.1"
  SIGMA: "0.05"
  PHI: "1.618"

  # Application Settings
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://vulnsphere.example.com"

  # Feature Flags
  ENABLE_QUANTUM_NOISE: "true"
  ENABLE_EARLY_STOPPING: "true"
  ENABLE_CHAOS_BOOST: "true"
