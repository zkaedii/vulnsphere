apiVersion: v1
kind: Secret
metadata:
  name: vulnsphere-secrets
  namespace: vulnsphere
  labels:
    app: vulnsphere-prime
type: Opaque
stringData:
  # Replace these with actual values in production
  # Use sealed-secrets or external-secrets for production deployments
  database-url: "postgresql://vulnsphere:CHANGE_ME@postgres:5432/vulnsphere"
  redis-url: "redis://redis:6379/0"
  jwt-secret: "CHANGE_ME_TO_A_SECURE_SECRET"
---
# Example of how to create secrets from kubectl:
# kubectl create secret generic vulnsphere-secrets \
#   --from-literal=database-url='postgresql://user:pass@host:5432/db' \
#   --from-literal=redis-url='redis://host:6379/0' \
#   --from-literal=jwt-secret='your-secure-secret' \
#   -n vulnsphere
