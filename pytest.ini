[pytest]
# Pytest configuration for VulnSphere PRIME

# Test discovery settings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude MPI-specific tests that require mpiexec
# These should be run manually with: mpiexec -n <N> python <script>
norecursedirs =
    .git
    __pycache__
    .pytest_cache
    node_modules
    frontend

# Ignore non-pytest test scripts
collect_ignore = [
    "tests/mpi_hello_cart.py",
]

# Output settings
addopts = -v --tb=short

# Async mode for pytest-asyncio
asyncio_mode = auto
